# Task runner file used by the Wails 3 CLI (`wails3 dev`, `wails3 build`).
# `wails3 task <name>` runs any task below; the CLI bundles Task, so there is
# nothing else to install.
version: "3"

vars:
  APP_NAME: daad-ide
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  EXE: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  install:frontend:deps:
    summary: Installs the frontend dependencies
    run: once
    sources:
      - package.json
      - yarn.lock
    status:
      - test -d node_modules
    cmds:
      - yarn install

  build:frontend:
    summary: Builds the frontend into dist/renderer (embedded by main.go)
    run: once
    deps:
      - install:frontend:deps
    cmds:
      - yarn build:frontend

  build:
    summary: Builds the application into bin/. Pass DEV=true for a debug build.
    deps:
      - build:frontend
    vars:
      BUILD_FLAGS: '{{if eq (.DEV | default "false") "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="{{if eq OS "windows"}}-H windowsgui {{end}}-w -s"{{end}}'
    env:
      # Linux and macOS use the system webview through cgo; Windows does not.
      CGO_ENABLED: '{{if eq OS "windows"}}0{{else}}1{{end}}'
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}{{.EXE}}

  run:
    summary: Runs the built application
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}{{.EXE}}'

  dev:frontend:
    summary: Starts the Vite dev server on the port chosen by `wails3 dev`
    deps:
      - install:frontend:deps
    cmds:
      - yarn dev:frontend --port {{.VITE_PORT}} --strictPort

  dev:
    summary: Runs the application in development mode (hot reload)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
