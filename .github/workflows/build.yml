name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build (${{ matrix.build.name }})
    runs-on: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        # Wails 3 links the system webview through cgo on Linux and macOS, so
        # each of those targets is built natively on a matching runner.
        build:
          - os: ubuntu-latest
            name: app-linux-amd64
            goos: linux
            goarch: amd64

          - os: ubuntu-24.04-arm
            name: app-linux-arm64
            goos: linux
            goarch: arm64

          - os: windows-latest
            name: app-windows-amd64.exe
            goos: windows
            goarch: amd64

          - os: windows-latest
            name: app-windows-arm64.exe
            goos: windows
            goarch: arm64

          - os: macos-latest
            name: app-macos-arm64
            goos: darwin
            goarch: arm64

          - os: macos-13
            name: app-macos-amd64
            goos: darwin
            goarch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        run: |
          yarn install --frozen-lockfile
          yarn build:frontend

      - name: Build app
        shell: bash
        env:
          GOOS: ${{ matrix.build.goos }}
          GOARCH: ${{ matrix.build.goarch }}
          CGO_ENABLED: ${{ matrix.build.goos == 'windows' && '0' || '1' }}
        run: |
          go mod download
          LDFLAGS="-w -s"
          if [ "$GOOS" = "windows" ]; then LDFLAGS="-H windowsgui $LDFLAGS"; fi
          mkdir -p bin
          go build -tags production -trimpath -ldflags "$LDFLAGS" -o "bin/${{ matrix.build.name }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: bin/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
