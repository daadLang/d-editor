name: Publish Cross-Compilation Images

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - build/docker/Dockerfile.cross
      - .github/workflows/publish-cross-images.yml
      - .github/workflows/release-config.yml

permissions:
  contents: read
  packages: write

jobs:
  config:
    uses: ./.github/workflows/release-config.yml

  publish:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: build/docker
          file: build/docker/Dockerfile.cross
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/daadlang/d-editor/wails-cross:${{ needs.config.outputs.cross_image_tag }}-${{ matrix.architecture }}
            ghcr.io/daadlang/d-editor/wails-cross:latest-${{ matrix.architecture }}
          cache-from: type=gha,scope=wails-cross-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=wails-cross-${{ matrix.architecture }}